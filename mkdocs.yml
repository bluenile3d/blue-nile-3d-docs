site_name: BLUE NILE 3D Documentation
site_description: Official documentation for BLUE NILE 3D tools, add-ons, resources, and related products.
site_author: BLUE NILE 3D
site_url: https://docs.bluenile.design/
repo_url: https://github.com/bluenile3d/blue-nile-3d-docs
repo_name: bluenile3d/blue-nile-3d-docs

theme:
  name: material
  language: en
  font: false
  custom_dir: overrides
  logo: assets/images/brand/blue-nile-block-symbol-bone-solid.svg
  favicon: assets/images/brand/favicon.ico
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys

extra_css:
  - assets/stylesheets/extra.css

copyright: Copyright &copy; BLUE NILE 3D

nav:
  - Home: index.md
  - Blender Add-ons:
      - Old Modifier Menu:
          - Overview: old-modifier-menu/index.md
          - User Guide: old-modifier-menu/user-guide.md
          - FAQ: old-modifier-menu/faq.md
      - RUNIC:
          - Overview: runic/index.md
          - User Guide: runic/user-guide.md
          - FAQ: runic/faq.md
      - Magic Eye Maker:
          - Overview: magic-eye-maker/index.md
          - User Guide: magic-eye-maker/user-guide.md
          - FAQ: magic-eye-maker/faq.md
      - Style Thief:
          - Overview: style-thief/index.md
          - User Guide: style-thief/user-guide.md
          - FAQ: style-thief/faq.md
